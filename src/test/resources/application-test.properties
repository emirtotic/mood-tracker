spring.application.name=mood-tracker-test
application.title=Mood Tracker Test
application.version=test
application.author=Emir Totic

spring.datasource.url=jdbc:h2:mem:mood-tracker;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=someusername
spring.datasource.password=somepassword
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

jwt.secret=test
jwt.expiration=3600000
openrouter.base-url=https://openrouter.example
openrouter.api-key=test
openrouter.referer=https://mood-tracker.example
openrouter.title=Mood Tracker Test
openrouter.model=test-model
openrouter.fallback-model=test-fallback-model
server.port=0
app.domain=localhost
